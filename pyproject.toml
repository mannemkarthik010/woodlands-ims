[project]
name = "woodlands-ims"
version = "0.1.0"
description = "Operations & Inventory Management System for Woodlands Indian Cuisine"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — unused imports, undefined names
    "I",        # isort — import order
    "B",        # bugbear — real bug patterns
    "UP",       # pyupgrade — modern syntax
    "DJ",       # flake8-django
    "C4",       # comprehensions
    "SIM",      # simplify
]
ignore = [
    "E501",     # line length is handled by the formatter
    "B008",     # function call in default arg — normal in Django
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
