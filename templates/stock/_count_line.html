{# Expected quantity is deliberately absent. Showing it turns counting into
   confirming, and a sheet that agrees with itself tells you nothing. #}
<form class="hit {% if saved %}hit--saved{% endif %} {% if bad %}hit--bad{% endif %}"
      hx-post="{% url 'count_save_line' line.count_id line.pk %}"
      hx-trigger="change from:find input"
      hx-target="closest li"
      hx-swap="innerHTML">
  {% csrf_token %}
  <span class="hit__name">{{ line.item.name }}</span>
  <input class="hit__qty" type="text" name="counted"
         inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*"
         value="{{ line.counted_quantity|default_if_none:'' }}"
         placeholder="—"
         aria-label="Counted quantity of {{ line.item.name }} in {{ line.item.base_unit.code }}">
  <span class="hit__unit">{{ line.item.base_unit.code }}</span>
</form>
{% if remaining is not None %}
  <span hx-swap-oob="innerHTML:#progress">{{ remaining }} left</span>
{% endif %}
